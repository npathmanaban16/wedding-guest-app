<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wedding Guest App</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: #FAF7F4;
      color: #1C1810;
      margin: 0;
      padding: 48px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    main {
      max-width: 480px;
      width: 100%;
      background: #ffffff;
      border: 1px solid #E8E1D7;
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: 0 4px 24px rgba(28, 24, 16, 0.06);
      text-align: center;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 8px 0;
      letter-spacing: 0.3px;
      color: #1C1810;
    }
    p {
      color: #6B6558;
      font-size: 14px;
      line-height: 1.6;
      margin: 0 0 24px 0;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      margin: 8px 0;
    }
    a {
      display: block;
      padding: 12px 16px;
      background: #FAF7F4;
      border: 1px solid #E8E1D7;
      border-radius: 999px;
      color: #8B5E6B;
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
      transition: background 0.15s ease;
    }
    a:hover, a:focus {
      background: #F3EDE4;
    }
  </style>
</head>
<body>
  <main>
    <h1>Wedding Guest App</h1>
    <p>App documentation and policy pages.</p>
    <ul>
      <li><a href="./privacy-policy.html">Privacy Policy</a></li>
      <li><a href="./tetherly-privacy-policy.html">Tetherly Privacy Policy</a></li>
      <li><a href="./tetherly-support.html">Tetherly Support</a></li>
    </ul>
  </main>
</body>
</html>
